<!DOCTYPE html><html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>উত্তরাধিকার হিসাব</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-green-100 min-h-screen text-gray-800">
  <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg mt-4 mb-10">
    <div class="bg-green-600 text-white text-center py-4 rounded-t-xl">
      <h1 class="text-2xl font-bold">উত্তরাধিকার</h1>
    </div><div class="px-6 pt-4 pb-6">
  <h2 class="text-lg font-semibold text-purple-700 border-b pb-2 mb-4">জীবিত আত্মীয়-স্বজনের তালিকা (মুসলিম)</h2>
  <div class="space-y-3">
    <div class="flex justify-between items-center">
      <label>স্বামী</label>
      <div class="flex items-center space-x-2">
        <button onclick="adjust('husband', -1)" class="bg-green-200 px-2 rounded">-</button>
        <input id="husband" type="number" value="0" class="w-12 text-center border rounded">
        <button onclick="adjust('husband', 1)" class="bg-green-200 px-2 rounded">+</button>
      </div>
    </div>
    <div class="flex justify-between items-center">
      <label>স্ত্রী</label>
      <div class="flex items-center space-x-2">
        <button onclick="adjust('wives', -1)" class="bg-green-200 px-2 rounded">-</button>
        <input id="wives" type="number" value="0" class="w-12 text-center border rounded">
        <button onclick="adjust('wives', 1)" class="bg-green-200 px-2 rounded">+</button>
      </div>
    </div>
    <div class="flex justify-between items-center">
      <label>পুত্র</label>
      <div class="flex items-center space-x-2">
        <button onclick="adjust('sons', -1)" class="bg-green-200 px-2 rounded">-</button>
        <input id="sons" type="number" value="0" class="w-12 text-center border rounded">
        <button onclick="adjust('sons', 1)" class="bg-green-200 px-2 rounded">+</button>
      </div>
    </div>
    <div class="flex justify-between items-center">
      <label>কন্যা</label>
      <div class="flex items-center space-x-2">
        <button onclick="adjust('daughters', -1)" class="bg-green-200 px-2 rounded">-</button>
        <input id="daughters" type="number" value="0" class="w-12 text-center border rounded">
        <button onclick="adjust('daughters', 1)" class="bg-green-200 px-2 rounded">+</button>
      </div>
    </div>
    <div class="flex justify-between items-center">
      <label>পিতা</label>
      <div class="flex items-center space-x-2">
        <button onclick="adjust('father', -1)" class="bg-green-200 px-2 rounded">-</button>
        <input id="father" type="number" value="0" class="w-12 text-center border rounded">
        <button onclick="adjust('father', 1)" class="bg-green-200 px-2 rounded">+</button>
      </div>
    </div>
    <div class="flex justify-between items-center">
      <label>মাতা</label>
      <div class="flex items-center space-x-2">
        <button onclick="adjust('mother', -1)" class="bg-green-200 px-2 rounded">-</button>
        <input id="mother" type="number" value="0" class="w-12 text-center border rounded">
        <button onclick="adjust('mother', 1)" class="bg-green-200 px-2 rounded">+</button>
      </div>
    </div>
  </div>

  <div class="mt-6">
    <button onclick="calculateInheritance()" class="w-full bg-purple-600 text-white py-2 rounded hover:bg-purple-700">ফলাফল</button>
    <div id="inheritanceResult" class="mt-4 p-3 bg-purple-50 rounded text-sm text-purple-800 border border-purple-200"></div>
  </div>
</div>

  </div><script>
function adjust(id, change) {
  const input = document.getElementById(id);
  let value = parseInt(input.value) + change;
  input.value = Math.max(0, value);
}

function calculateInheritance() {
  const husband = parseInt(document.getElementById('husband').value);
  const wives = parseInt(document.getElementById('wives').value);
  const sons = parseInt(document.getElementById('sons').value);
  const daughters = parseInt(document.getElementById('daughters').value);
  const father = parseInt(document.getElementById('father').value);
  const mother = parseInt(document.getElementById('mother').value);

  let result = '<ul class="list-disc pl-5">';

  if (husband > 0) result += `<li>স্বামী: মোট উত্তরাধিকার ২৫%</li>`;
  if (wives > 0) result += `<li>স্ত্রী ${wives} জন: মোট ${wives * (1/8 * 100)}%</li>`;
  if (father) result += `<li>পিতা: ১৬.৬৭%</li>`;
  if (mother) result += `<li>মাতা: ১৬.৬৭%</li>`;

  if (sons + daughters > 0) {
    const totalPortion = sons * 2 + daughters * 1;
    if (sons > 0) result += `<li>পুত্র (${sons}): ${(2/totalPortion*100).toFixed(2)}% করে</li>`;
    if (daughters > 0) result += `<li>কন্যা (${daughters}): ${(1/totalPortion*100).toFixed(2)}% করে</li>`;
  }

  result += '</ul>';
  document.getElementById('inheritanceResult').innerHTML = result;
}
</script></body>
</html>
