<!DOCTYPE html><html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>উত্তরাধিকার হিসাব</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-green-100 min-h-screen text-gray-800">
  <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg mt-4 mb-10">
    <div class="bg-green-600 text-white text-center py-4 rounded-t-xl">
      <h1 class="text-2xl font-bold">উত্তরাধিকার</h1>
    </div><div class="px-6 pt-4 pb-6">
  <h2 class="text-lg font-semibold text-purple-700 border-b pb-2 mb-4">আত্মীয়-স্বজনের তালিকা</h2>
  <div class="grid grid-cols-1 gap-3 max-h-[400px] overflow-y-auto pr-2">
    <!-- Static Fields -->
    <div class="flex justify-between items-center">
      <label>স্বামী</label>
      <div class="flex items-center space-x-2">
        <button onclick="adjust('husband', -1)" class="bg-green-200 px-2 rounded">-</button>
        <input id="husband" type="number" value="0" class="w-12 text-center border rounded">
        <button onclick="adjust('husband', 1)" class="bg-green-200 px-2 rounded">+</button>
      </div>
    </div>
    <div class="flex justify-between items-center">
      <label>স্ত্রী</label>
      <div class="flex items-center space-x-2">
        <button onclick="adjust('wives', -1)" class="bg-green-200 px-2 rounded">-</button>
        <input id="wives" type="number" value="0" class="w-12 text-center border rounded">
        <button onclick="adjust('wives', 1)" class="bg-green-200 px-2 rounded">+</button>
      </div>
    </div>
    <div class="flex justify-between items-center">
      <label>পুত্র</label>
      <div class="flex items-center space-x-2">
        <button onclick="adjust('sons', -1)" class="bg-green-200 px-2 rounded">-</button>
        <input id="sons" type="number" value="0" class="w-12 text-center border rounded">
        <button onclick="adjust('sons', 1)" class="bg-green-200 px-2 rounded">+</button>
      </div>
    </div>
    <div class="flex justify-between items-center">
      <label>কন্যা</label>
      <div class="flex items-center space-x-2">
        <button onclick="adjust('daughters', -1)" class="bg-green-200 px-2 rounded">-</button>
        <input id="daughters" type="number" value="0" class="w-12 text-center border rounded">
        <button onclick="adjust('daughters', 1)" class="bg-green-200 px-2 rounded">+</button>
      </div>
    </div>
  </div>

  <h2 class="text-lg font-semibold text-purple-700 border-b pb-2 mt-6 mb-4">সম্পদের বিবরণ</h2>
  <div class="flex justify-between items-center mb-6">
    <label>জমি (শতাংশ)</label>
    <input id="land" type="number" value="0" class="w-24 text-center border rounded">
  </div>

  <button onclick="calculateInheritance()" class="w-full bg-purple-600 text-white py-2 rounded hover:bg-purple-700">ফলাফল</button>
  <div id="inheritanceResult" class="mt-4 p-3 bg-purple-50 rounded text-sm text-purple-800 border border-purple-200"></div>
  <canvas id="chartCanvas" class="mt-6"></canvas>
</div>

  </div><script>
function adjust(id, change) {
  const input = document.getElementById(id);
  let value = parseInt(input.value) + change;
  input.value = Math.max(0, value);
}

function calculateInheritance() {
  const husbands = parseInt(document.getElementById('husband').value);
  const wives = parseInt(document.getElementById('wives').value);
  const sons = parseInt(document.getElementById('sons').value);
  const daughters = parseInt(document.getElementById('daughters').value);
  const land = parseFloat(document.getElementById('land').value);

  if ((sons + daughters + husbands + wives) === 0 || isNaN(land) || land <= 0) {
    document.getElementById('inheritanceResult').innerHTML = "<p class='text-red-600'>কমপক্ষে একজন আত্মীয় এবং জমির পরিমাণ দিন।</p>";
    return;
  }

  let labels = [];
  let shares = [];
  let html = '<table class="w-full text-left border mb-4"><thead><tr class="bg-green-200"><th class="p-1">আত্মীয়</th><th class="p-1">অংশ</th><th class="p-1">জমি</th></tr></thead><tbody>';

  if (husbands > 0) {
    const share = 0.25;
    const value = (share * land).toFixed(2);
    html += `<tr><td class="p-1">স্বামী</td><td class="p-1">${share.toFixed(3)}</td><td class="p-1">${value}</td></tr>`;
    labels.push("স্বামী");
    shares.push(parseFloat(value));
  }
  if (wives > 0) {
    const share = 0.125;
    const value = ((share * wives) * land).toFixed(2);
    html += `<tr><td class="p-1">স্ত্রী (${wives} জন)</td><td class="p-1">${(share * wives).toFixed(3)}</td><td class="p-1">${value}</td></tr>`;
    labels.push("স্ত্রী");
    shares.push(parseFloat(value));
  }

  const totalPortion = sons * 2 + daughters * 1;
  if (sons > 0) {
    const share = 2 / totalPortion;
    for (let i = 1; i <= sons; i++) {
      const value = (share * land).toFixed(2);
      html += `<tr><td class="p-1">পুত্র ${i}</td><td class="p-1">${share.toFixed(3)}</td><td class="p-1">${value}</td></tr>`;
      labels.push(`পুত্র ${i}`);
      shares.push(parseFloat(value));
    }
  }
  if (daughters > 0) {
    const share = 1 / totalPortion;
    for (let i = 1; i <= daughters; i++) {
      const value = (share * land).toFixed(2);
      html += `<tr><td class="p-1">কন্যা ${i}</td><td class="p-1">${share.toFixed(3)}</td><td class="p-1">${value}</td></tr>`;
      labels.push(`কন্যা ${i}`);
      shares.push(parseFloat(value));
    }
  }

  html += '</tbody></table>';
  document.getElementById('inheritanceResult').innerHTML = html;

  const ctx = document.getElementById('chartCanvas').getContext('2d');
  if (window.pieChart) window.pieChart.destroy();
  window.pieChart = new Chart(ctx, {
    type: 'pie',
    data: {
      labels: labels,
      datasets: [{
        label: 'জমির বণ্টন',
        data: shares,
        backgroundColor: ['#6EE7B7', '#C4B5FD', '#FDE68A', '#FCA5A5', '#93C5FD', '#FBCFE8']
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'bottom' } }
    }
  });
}
</script></body>
</html>
