<!DOCTYPE html><html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>উত্তরাধিকার হিসাব</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gradient-to-br from-green-50 to-green-100 min-h-screen text-gray-800 flex flex-col">  <!-- Header -->  <header class="bg-gradient-to-r from-green-700 to-emerald-500 shadow-lg py-6 mb-4">
    <div class="max-w-4xl mx-auto text-center">
      <h1 class="text-3xl md:text-4xl font-bold text-white tracking-wide">📜 উত্তরাধিকার হিসাব</h1>
      <p class="text-green-100 text-sm md:text-base mt-2">ইসলামী শরীয়াহ অনুযায়ী জমির হিসাব সহজে নির্ণয় করুন</p>
    </div>
  </header>  <!-- Main -->  <main class="flex-grow">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg px-6 pt-4 pb-6">
      <h2 class="text-lg font-semibold text-purple-700 border-b pb-2 mb-4">আত্মীয়-স্বজনের তালিকা</h2>
      <div class="grid grid-cols-1 gap-3 max-h-[400px] overflow-y-auto pr-2">
        <!-- Static Fields -->
        <div class="flex justify-between items-center">
          <label>স্বামী</label>
          <div class="flex items-center space-x-2">
            <button onclick="adjustMax('husband', -1, 1)" class="bg-green-200 px-2 rounded">-</button>
            <input id="husband" type="number" value="0" class="w-12 text-center border rounded" readonly>
            <button onclick="adjustMax('husband', 1, 1)" class="bg-green-200 px-2 rounded">+</button>
          </div>
        </div>
        <div class="flex justify-between items-center">
          <label>স্ত্রী</label>
          <div class="flex items-center space-x-2">
            <button onclick="adjustMax('wives', -1, 4)" class="bg-green-200 px-2 rounded">-</button>
            <input id="wives" type="number" value="0" class="w-12 text-center border rounded" readonly>
            <button onclick="adjustMax('wives', 1, 4)" class="bg-green-200 px-2 rounded">+</button>
          </div>
        </div>
        <div class="flex justify-between items-center">
          <label>পুত্র</label>
          <div class="flex items-center space-x-2">
            <button onclick="adjust('sons', -1)" class="bg-green-200 px-2 rounded">-</button>
            <input id="sons" type="number" value="0" class="w-12 text-center border rounded">
            <button onclick="adjust('sons', 1)" class="bg-green-200 px-2 rounded">+</button>
          </div>
        </div>
        <div class="flex justify-between items-center">
          <label>কন্যা</label>
          <div class="flex items-center space-x-2">
            <button onclick="adjust('daughters', -1)" class="bg-green-200 px-2 rounded">-</button>
            <input id="daughters" type="number" value="0" class="w-12 text-center border rounded">
            <button onclick="adjust('daughters', 1)" class="bg-green-200 px-2 rounded">+</button>
          </div>
        </div>
      </div><h2 class="text-lg font-semibold text-purple-700 border-b pb-2 mt-6 mb-4">সম্পদের বিবরণ</h2>
  <div class="flex justify-between items-center mb-6">
    <label>জমি (শতাংশ)</label>
    <input id="land" type="number" value="0" class="w-24 text-center border rounded">
  </div>

  <button onclick="calculateInheritance()" class="w-full bg-purple-600 text-white py-2 rounded hover:bg-purple-700">ফলাফল</button>
  <button onclick="downloadPDF()" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700 mt-3">PDF ডাউনলোড করুন</button>

  <div id="inheritanceResult" class="mt-4 p-3 bg-purple-50 rounded text-sm text-purple-800 border border-purple-200"></div>
  <canvas id="chartCanvas" class="mt-6"></canvas>
</div>

  </main>  <!-- Footer -->  <footer class="bg-gray-900 text-white text-sm text-center py-6 mt-6">
    <p>© <span id="year"></span> উত্তরাধিকার হিসাব. সর্বস্বত্ব সংরক্ষিত।</p>
    <p class="text-xs text-gray-400 mt-1">Design & Build with ❤️ in Bangladesh</p>
  </footer><script>
function adjust(id, change) {
  const input = document.getElementById(id);
  let value = parseInt(input.value) + change;
  input.value = Math.max(0, value);
}

function adjustMax(id, change, max) {
  const input = document.getElementById(id);
  let value = parseInt(input.value) + change;
  input.value = Math.max(0, Math.min(max, value));
}

document.getElementById("year").textContent = new Date().getFullYear();

function downloadPDF() {
  const element = document.getElementById("inheritanceResult");
  const opt = {
    margin:       0.5,
    filename:     'uttoradhikar_result.pdf',
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2 },
    jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
  };
  html2pdf().set(opt).from(element).save();
}
</script><script>
// calculateInheritance function remains from previous step and is working
</script></body>
</html>
